name: reconcile
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: reconcile spend to the livegraph meter
        env:
          LIVEGRAPH_API_KEY: ${{ secrets.LIVEGRAPH_API_KEY }}
        run: node scripts/reconcile-spend.mjs
      - name: commit on drift
        run: |
          if git diff --quiet data/ledger.jsonl; then
            echo "books in sync — nothing to commit"
            exit 0
          fi
          git config user.name "sckrilla[bot]"
          git config user.email "sckrilla-bot@users.noreply.github.com"
          git add data/ledger.jsonl
          git commit -m "ledger: auto-reconcile spend to the meter [skip ci]"
          git pull --rebase
          git push
